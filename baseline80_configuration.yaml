training_date: '20260515'
version: v16
results_path: ./RESULTS/20260515_SPECFORMER_regression_baseline80_rangeauto_auto_FULL_CHANNELS_CHANNEL_PENALTY
checkpoint_path: ./regression_tensorboard\checkpoints\best_regression_model.pth
inference:
  inference_only: false
  use_saved_model: false
data:
  file: allRecords6.pkl
  wavelength_nm_range: null
  sequence_length: 67
  use_absorption_only: false
  use_signal_std: true
  normalize_labels: false
  use_time: false
  train_split: 0.6
  val_split: 0.3
  test_split: 0.1
  baseline: 80
  diabetes_mode: 0
  population_normalize: false
  population_normalize_only: false
  population_average_path: ./RESULTS/20260515_SPECFORMER_regression_baseline80_rangeauto_auto_FULL_CHANNELS_CHANNEL_PENALTY\baseline80_population_average.npy
channels:
  num_base_channels: 8
  num_total_channels: 16
  channel_names:
  - measure
  - measure_std
  - dark
  - dark_std
  - reference
  - reference_std
  - absorption_sensor
  - absorption_std
  - norm_measure
  - norm_measure_std
  - norm_dark
  - norm_dark_std
  - norm_reference
  - norm_reference_std
  - norm_absorption_sensor
  - norm_absorption_std
  penalized_channel_indices:
  - 2
  - 3
  - 4
  - 5
  - 10
  - 11
  - 12
  - 13
  penalized_channel_names:
  - dark
  - dark_std
  - reference
  - reference_std
  - norm_dark
  - norm_dark_std
  - norm_reference
  - norm_reference_std
outlier_removal:
  remove_absorption_outliers: true
  outlier_threshold_std: 3
  outlier_method: per_wavelength
normalization:
  norm_method: snv
  per_channel_norm: true
  average_norm: true
augmentation:
  augment_noise: false
  use_mixup: false
  mixup_alpha: 0.1
weighted_sampling:
  use_weighted_sampling: false
  weighted_sampling_bins: 10
  weighted_sampling_power: 0.4
  undersample: false
loss:
  use_huber_loss: true
  huber_delta: 10.0
  nll_weight: 0.5
  huber_weight: 0.5
gradient_penalty:
  gradient_penalty: 0.0
  channel_gradient_penalty: true
  base_penalty_weight: 0.001
  penalized_channel_weight: 0.003
  gradient_penalty_subsample: 32
  base_penalized_channels:
  - 2
  - 3
  - 4
  - 5
mean_collapse:
  check_mean_collapse: true
  mean_collapse_check_epochs: 5
  mean_collapse_std_ratio_threshold: 0.1
  mean_collapse_range_threshold: 0.1
lr_scheduler:
  use_cosine_annealing: true
  cosine_t0: 10
  cosine_t_mult: 2
  cosine_eta_min: 5.0e-05
  use_reduce_lr_on_plateau: false
  plateau_factor: 0.5
  plateau_patience: 10
  plateau_min_lr: 1.0e-05
  plateau_threshold: 5.0e-05
  finetune_use_plateau: true
model:
  model_type: SPECFORMER
  d_model: 256
  nhead: 8
  num_encoder_layers: 8
  dim_feedforward: 512
  dropout: 0.1
  spectral_dropout: 0
  conv_kernel_size: 15
  num_inputs: 16
  sequence_length: 67
  num_classes: 1
training:
  optimizer: AdamW
  learning_rate: 0.0002
  learning_rate_finetune: 0.0001
  weight_decay: 1.0e-05
  max_grad_norm: 1.0
  batch_size: 300
  patience: 30
  max_epochs: 10000
