training_date: '20260528'
version: v16
results_path: ./RESULTS/20260528_SPECFORMER_regression_baseline-1_rangeauto_auto_FULL_CHANNELS_CHANNEL_PENALTY_TIME
checkpoint_path: ./regression_tensorboard\checkpoints\best_regression_model.pth
inference:
  inference_only: false
  use_saved_model: false
data:
  file: allRecords6.pkl
  wavelength_nm_range: null
  sequence_length: 67
  use_absorption_only: false
  use_signal_std: false
  exclude_dark_reference: false
  normalize_labels: false
  use_time: true
  train_split: 0.8
  val_split: 0.15
  test_split: 0.05
  baseline: -1
  diabetes_mode: -1
  population_normalize: false
  population_normalize_only: false
  population_average_path: ./RESULTS/20260528_SPECFORMER_regression_baseline-1_rangeauto_auto_FULL_CHANNELS_CHANNEL_PENALTY_TIME\baseline-1_population_average.npy
channels:
  num_base_channels: 4
  num_total_channels: 6
  channel_names:
  - measure
  - dark
  - reference
  - absorption_sensor
  penalized_channel_indices:
  - 1
  - 2
  penalized_channel_names:
  - dark
  - reference
outlier_removal:
  remove_absorption_outliers: true
  outlier_threshold_std: 3
  outlier_method: per_wavelength
normalization:
  norm_method: none
  per_channel_norm: false
  average_norm: false
  use_spectral_derivatives: false
  sg_derivative_order: 2
  sg_window_length: 11
  sg_poly_order: 3
augmentation:
  augment_noise: true
  augment_offset: true
  offset_noise_pct: 0.1
  use_mixup: false
  mixup_alpha: 0.1
weighted_sampling:
  use_weighted_sampling: false
  weighted_sampling_bins: 10
  weighted_sampling_power: 0.4
  undersample: false
loss:
  use_huber_loss: true
  huber_delta: 10.0
  nll_weight: 0.5
  huber_weight: 0.5
gradient_penalty:
  gradient_penalty: 0.0
  channel_gradient_penalty: true
  base_penalty_weight: 0.001
  penalized_channel_weight: 0.005
  gradient_penalty_subsample: 32
  base_penalized_channels:
  - 1
  - 2
mean_collapse:
  check_mean_collapse: true
  mean_collapse_check_epochs: 5
  mean_collapse_std_ratio_threshold: 0.1
  mean_collapse_range_threshold: 0.1
lr_scheduler:
  use_cosine_annealing: true
  cosine_t0: 10
  cosine_t_mult: 2
  cosine_eta_min: 5.0e-05
