  plateau_patience: 10
  plateau_min_lr: 1.0e-05
  plateau_threshold: 5.0e-05
  finetune_use_plateau: true
model:
  model_type: SPECFORMER
  d_model: 256
  nhead: 8
  num_encoder_layers: 8
  dim_feedforward: 512
  dropout: 0.1
  spectral_dropout: 0
  conv_kernel_size: 15
  num_inputs: 6
  sequence_length: 67
  num_classes: 1
training:
  optimizer: AdamW
  learning_rate: 0.0002
  learning_rate_finetune: 0.0001
  weight_decay: 1.0e-05
  max_grad_norm: 1.0
  batch_size: 300
  patience: 8
  max_epochs: 10000
