training_date: '20260403'
version: v15
results_path: ./RESULTS/20260403_BANDENSEMBLE_regression_baseline-1_range450_650_band25nm_FULL_CHANNELS_CHANNEL_PENALTY
checkpoint_path: ./regression_tensorboard\checkpoints\best_band_model.pth
data:
  file: outlierRemovedAppendedRecords4.pkl
  wavelength_nm_range:
  - 450
  - 650
  sequence_length: 200
  use_absorption: true
  use_absorption_only: false
  use_signal_std: false
  normalize_labels: false
  train_split: 0.9
  val_split: 0.09
  test_split: 0.01
  baseline: -1
  diabetes_mode: -1
channels:
  num_base_channels: 4
  num_total_channels: 16
  channel_names:
  - measure
  - dark
  - reference
  - absorption_sensor
  - d1_measure
  - d1_dark
  - d1_reference
  - d1_absorption_sensor
  - norm_measure
  - norm_dark
  - norm_reference
  - norm_absorption_sensor
  - norm_d1_measure
  - norm_d1_dark
  - norm_d1_reference
  - norm_d1_absorption_sensor
  penalized_channel_indices:
  - 1
  - 2
  - 5
  - 6
  - 9
  - 10
  - 13
  - 14
  penalized_channel_names:
  - dark
  - reference
  - d1_dark
  - d1_reference
  - norm_dark
  - norm_reference
  - norm_d1_dark
  - norm_d1_reference
outlier_removal:
  remove_absorption_outliers: true
  outlier_threshold_std: 2
  outlier_method: per_wavelength
spectral:
  add_spectral_derivatives: true
  derivative_order: 1
normalization:
  norm_method: snv
  per_channel_norm: true
  average_norm: true
augmentation:
  augment_noise: true
  use_mixup: false
  mixup_alpha: 0.1
weighted_sampling:
  use_weighted_sampling: true
  weighted_sampling_bins: 10
  weighted_sampling_power: 0.8
loss:
  use_huber_loss: true
  huber_delta: 10.0
  nll_weight: 0.5
  huber_weight: 0.5
gradient_penalty:
  channel_gradient_penalty: true
  base_penalty_weight: 0.001
  penalized_channel_weight: 0.003
  gradient_penalty_subsample: 32
  base_penalized_channels:
  - 1
  - 2
mean_collapse:
  check_mean_collapse: true
  mean_collapse_check_epochs: 5
  mean_collapse_std_ratio_threshold: 0.1
  mean_collapse_range_threshold: 0.1
lr_scheduler:
  use_cosine_annealing: true
  cosine_t0: 10
  cosine_t_mult: 2
  cosine_eta_min: 5.0e-05
  use_reduce_lr_on_plateau: false
  plateau_factor: 0.5
  plateau_patience: 10
  plateau_min_lr: 1.0e-05
