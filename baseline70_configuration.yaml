  - !!python/tuple
    - 475
    - 499
  - !!python/tuple
    - 500
    - 524
  - !!python/tuple
    - 525
    - 549
  - !!python/tuple
    - 550
    - 574
  - !!python/tuple
    - 575
    - 599
  - !!python/tuple
    - 600
    - 624
  - !!python/tuple
    - 625
    - 649
  num_inputs: 16
  sequence_length: 200
  num_classes: 1
training:
  optimizer: AdamW
  learning_rate: 0.0001
  learning_rate_finetune: 0.0005
  weight_decay: 1.0e-05
  max_grad_norm: 1.0
  batch_size: 300
  patience: 30
  max_epochs: 10000
